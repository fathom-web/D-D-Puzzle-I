name: Temple puzzle engine checks
on:
  push:
    branches: [main, feature/az-sahar-temple]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Test five-player puzzle invariants
        run: node tests/engine.test.mjs
