name: Az-Sahar Public Website Browser Test
on:
  push:
    paths:
      - 'tests/live_browser.test.js'
      - '.github/workflows/az-sahar-browser-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test live game in seven browsers
        run: node tests/live_browser.test.js
